# e-mine API — configuration commune
# Les valeurs sensibles viennent du fichier .env à la racine du dépôt (jamais versionné).
spring:
  application:
    name: emine-api
  config:
    import: optional:file:../.env[.properties],optional:file:./.env[.properties]
  threads:
    virtual:
      enabled: true
  jackson:
    time-zone: UTC
  # Connexion applicative : emine_app, soumise à la RLS (jamais le propriétaire du schéma)
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/emine}
    username: emine_app
    password: ${EMINE_APP_PASSWORD:}
    hikari:
      maximum-pool-size: 5
  # Migrations : emine_owner, propriétaire du schéma emine
  flyway:
    user: emine_owner
    password: ${EMINE_OWNER_PASSWORD:}
    schemas: emine
    default-schema: emine
    create-schemas: false

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
