# e-mine API — configuration commune
# Les valeurs sensibles viennent du fichier .env à la racine du dépôt (jamais versionné).
spring:
  application:
    name: emine-api
  config:
    import: optional:file:../.env[.properties],optional:file:./.env[.properties]
  threads:
    virtual:
      enabled: true
  jackson:
    time-zone: UTC
  # Messages d'erreur du catalogue (US-00.8) : français par défaut, anglais sur Accept-Language: en
  messages:
    basename: messages/erreurs
    encoding: UTF-8
    fallback-to-system-locale: false
  # Connexion applicative : emine_app, soumise à la RLS (jamais le propriétaire du schéma)
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/emine}
    username: emine_app
    password: ${EMINE_APP_PASSWORD:}
    hikari:
      maximum-pool-size: 5
  # Jetons OIDC émis par Keycloak (realm emine) ; l'audience emine-api est exigée
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER:http://localhost:8081/realms/emine}
          audiences: emine-api
  # Pièces jointes (US-03.2) : 10 Mo par fichier (DOC-002 au-delà)
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  # Migrations : emine_owner, propriétaire du schéma emine
  flyway:
    user: emine_owner
    password: ${EMINE_OWNER_PASSWORD:}
    schemas: emine
    default-schema: emine
    create-schemas: false

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  paths-to-match: /api/**
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# Stockage objet S3 (MinIO, D9). Identifiants dans .env ; à défaut, ceux du compte racine MinIO de dev.
emine:
  stockage:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    region: us-east-1
    cle-acces: ${S3_ACCESS_KEY:${MINIO_ROOT_USER:}}
    cle-secrete: ${S3_SECRET_KEY:${MINIO_ROOT_PASSWORD:}}
    compartiment-pieces: ${S3_BUCKET_PIECES:emine-pieces}
  # TrésorPay (simulé, D5) : contrat docs/contrats/tresorpay.md. Secret HMAC dans .env (fictif en dev).
  tresorpay:
    url-base: ${TRESORPAY_BASE_URL:http://localhost:8090}
    secret-hmac: ${TRESORPAY_HMAC_SECRET:}
    marchand-id: ${TRESORPAY_MERCHANT_ID:MARCHAND-TEST-0001}
    url-application: ${APP_URL:http://localhost:3001}
    tolerance-horodatage: 5m
    delai-reponse: 5s
