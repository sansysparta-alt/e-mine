# e-mine · messages d'erreur de l'API (US-00.8) — français, langue par défaut.
# Clé : erreur.<CODE>. Apostrophe typographique (’) : pas d'échappement MessageFormat nécessaire.
erreur.AUTH-001=Vous devez vous connecter pour accéder à ce service.
erreur.AUTH-002=Votre compte est verrouillé pour 15 minutes après plusieurs échecs de connexion.
erreur.AUTH-003=Votre compte n’est pas encore activé sur e-mine. Contactez l’administrateur.
erreur.PERM-001=Votre profil ne permet pas cette action.
erreur.VAL-001=Certaines informations sont invalides. Corrigez les champs signalés.
erreur.VAL-002=La requête est illisible ou incomplète.
erreur.DEM-001=Ce changement de statut n’est pas autorisé pour cette demande.
erreur.DEM-002=Demande introuvable.
erreur.DEM-003=Cette demande a déjà été déposée : elle ne peut plus être modifiée.
erreur.DEM-004=La demande est incomplète : joignez les pièces obligatoires et acceptez la déclaration sur l’honneur avant de la déposer.
erreur.DEM-005=Ce type de document n’existe pas ou n’est plus proposé.
erreur.DEM-006=Cette demande ne peut pas être déclarée recevable : les frais de dossier ne sont pas encore payés.
erreur.DEM-007=Cette demande ne peut pas être déclarée recevable : une pièce obligatoire n’a pas de fichier.
erreur.PAY-001=Ce paiement a déjà été effectué pour cette demande.
