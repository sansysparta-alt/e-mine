# Notification templates (US-07.1, US-07.2): English. Same keys as the French file (checked by tests).
commun.salutation=Dear {prenom},
commun.lien=Track my application
commun.pied=Automatic message from the e-mine platform of the Ministry of Mines and Geology. Please do not reply.
commun.entete=Ministry of Mines and Geology

DEMANDE_DEPOSEE.sujet=Application submitted · {numero}
DEMANDE_DEPOSEE.texte=Your application {numero} ({document}) has been submitted.\n\nNext step: pay the fees from your application tracking page. Review of your file starts as soon as payment is received.
DEMANDE_DEPOSEE.sms=e-mine: application {numero} submitted. Next step: pay the fees in your account.

PAIEMENT_CONFIRME.sujet=Payment confirmed · {reference}
PAIEMENT_CONFIRME.texte=Your payment of {montant_gnf} (reference {reference}) is confirmed. Receipt {recu} is available in your account.\n\nNo action is required from you: the Ministry is processing your file.
PAIEMENT_CONFIRME.sms=e-mine: payment {reference} of {montant_gnf} confirmed. Receipt {recu} in your account.

DEMANDE_RECEVABLE.sujet=File complete · {numero}
DEMANDE_RECEVABLE.texte=Your file {numero} ({document}) is complete and admissible. It is now being reviewed by the Ministry.\n\nNo action is required from you. You will be informed of the decision.
DEMANDE_RECEVABLE.sms=e-mine: file {numero} complete, review in progress. No action required.

COMPLEMENT_DEMANDE.sujet=Additional information requested · {numero}
COMPLEMENT_DEMANDE.texte=The Ministry requests additional information for your application {numero} ({document}). Documents expected: {pieces}.\n\nPlease reply before {dateLimite} from your application tracking page. The processing time is paused until you reply.
COMPLEMENT_DEMANDE.sms=e-mine: additional information requested for {numero}. Reply expected before {dateLimite} in your account.

COMPLEMENT_RELANCE.sujet=Reminder: additional information expected · {numero}
COMPLEMENT_RELANCE.texte=We have not yet received the additional information requested for your application {numero} ({document}). Please reply before {dateLimite} from your application tracking page.
COMPLEMENT_RELANCE.sms=e-mine: reminder, additional information expected for {numero} before {dateLimite}.

DECISION_DROITS.sujet=Favourable decision, fees due · {numero}
DECISION_DROITS.texte=A favourable decision has been made on your application {numero} ({document}).\n\nNext step: pay the fees of {montant_gnf} from your application tracking page. The document will be signed as soon as payment is received.
DECISION_DROITS.sms=e-mine: favourable decision for {numero}. Fees of {montant_gnf} to pay in your account.

DECISION_FAVORABLE.sujet=Favourable decision · {numero}
DECISION_FAVORABLE.texte=A favourable decision has been made on your application {numero} ({document}). The document is being signed.\n\nNo action is required from you. You will be informed as soon as it is available.
DECISION_FAVORABLE.sms=e-mine: favourable decision for {numero}. Document being signed.

DEMANDE_REJETEE.sujet=Application rejected · {numero}
DEMANDE_REJETEE.texte=Your application {numero} ({document}) has been rejected.\n\nReason: {motif}\n\nThe details of the decision are available on your application tracking page.
DEMANDE_REJETEE.sms=e-mine: application {numero} rejected. Reason and details in your account.

DOCUMENT_DELIVRE.sujet=Document issued · {numero}
DOCUMENT_DELIVRE.texte=Your document ({document}) has been signed and issued for application {numero}.\n\nYou can download it from your application tracking page. Its authenticity can be checked at any time with its QR code.
DOCUMENT_DELIVRE.sms=e-mine: document for application {numero} issued. Download it from your account.

PAIEMENT_A_VERIFIER.sujet=Payment under review · {reference}
PAIEMENT_A_VERIFIER.texte=Your payment (reference {reference}, expected amount {montant_gnf}) is being reviewed by the finance department: the amount received does not exactly match the expected amount.\n\nNo action is required from you for now. You will be informed of the outcome.
PAIEMENT_A_VERIFIER.sms=e-mine: payment {reference} under review. No action required.

REFERENCE_EXPIRE_BIENTOT.sujet=Payment reference expiring soon · {reference}
REFERENCE_EXPIRE_BIENTOT.texte=Payment reference {reference} ({montant_gnf}) expires on {dateExpiration}.\n\nPlease make the payment before this date. After expiry, a new reference will be offered.
REFERENCE_EXPIRE_BIENTOT.sms=e-mine: reference {reference} ({montant_gnf}) expires on {dateExpiration}. Please pay before then.

REMBOURSEMENT.sujet=Refund completed · {reference}
REMBOURSEMENT.texte=The refund of {montant_gnf} for payment {reference} has been completed.\n\nDetails are available in your account.
REMBOURSEMENT.sms=e-mine: refund of {montant_gnf} completed (payment {reference}).
