# Modèles des notifications (US-07.1, US-07.2) : français, langue par défaut.
# Chaque message dit où en est le dossier et, s'il y a lieu, ce que l'usager doit faire.
# {numero} = numéro de la demande ; {document} = libellé du document dans la langue du destinataire ;
# les autres variables viennent du contenu écrit par la base (montants en GNF, dates JJ/MM/AAAA).
# SMS : 160 caractères au plus (vérifié par les tests), sans accents (alphabet GSM, un seul segment).
commun.salutation=Bonjour {prenom},
commun.lien=Suivre ma demande
commun.pied=Message automatique de la plateforme e-mine du Ministère des Mines et de la Géologie. Merci de ne pas y répondre.
commun.entete=Ministère des Mines et de la Géologie

DEMANDE_DEPOSEE.sujet=Demande déposée · {numero}
DEMANDE_DEPOSEE.texte=Votre demande {numero} ({document}) est bien déposée.\n\nProchaine étape : le paiement des frais, depuis le suivi de votre demande. L'examen du dossier commence dès réception du paiement.
DEMANDE_DEPOSEE.sms=e-mine : demande {numero} deposee. Prochaine etape : payer les frais dans votre espace.

PAIEMENT_CONFIRME.sujet=Paiement confirmé · {reference}
PAIEMENT_CONFIRME.texte=Votre paiement de {montant_gnf} (référence {reference}) est confirmé. Le reçu {recu} est disponible dans votre espace.\n\nAucune action n'est attendue de votre part : le Ministère poursuit le traitement de votre dossier.
PAIEMENT_CONFIRME.sms=e-mine : paiement {reference} de {montant_gnf} confirme. Recu {recu} dans votre espace.

DEMANDE_RECEVABLE.sujet=Dossier complet · {numero}
DEMANDE_RECEVABLE.texte=Votre dossier {numero} ({document}) est complet et recevable. Il passe à l'instruction par les services du Ministère.\n\nAucune action n'est attendue de votre part. Un message vous sera envoyé dès la décision.
DEMANDE_RECEVABLE.sms=e-mine : dossier {numero} complet, instruction en cours. Aucune action de votre part.

COMPLEMENT_DEMANDE.sujet=Complément demandé · {numero}
COMPLEMENT_DEMANDE.texte=Le Ministère demande un complément pour votre demande {numero} ({document}). Pièces attendues : {pieces}.\n\nMerci de répondre avant le {dateLimite} depuis le suivi de votre demande. Le délai de traitement est suspendu jusqu'à votre réponse.
COMPLEMENT_DEMANDE.sms=e-mine : complement demande pour {numero}. Reponse attendue avant le {dateLimite} dans votre espace.

COMPLEMENT_RELANCE.sujet=Rappel : complément attendu · {numero}
COMPLEMENT_RELANCE.texte=Nous n'avons pas encore reçu le complément demandé pour votre demande {numero} ({document}). Merci de répondre avant le {dateLimite} depuis le suivi de votre demande.
COMPLEMENT_RELANCE.sms=e-mine : rappel, complement attendu pour {numero} avant le {dateLimite}.

DECISION_DROITS.sujet=Décision favorable, droits à payer · {numero}
DECISION_DROITS.texte=Une décision favorable a été prise sur votre demande {numero} ({document}).\n\nProchaine étape : le paiement des droits de {montant_gnf}, depuis le suivi de votre demande. Le document sera signé dès réception du paiement.
DECISION_DROITS.sms=e-mine : decision favorable pour {numero}. Droits de {montant_gnf} a payer dans votre espace.

DECISION_FAVORABLE.sujet=Décision favorable · {numero}
DECISION_FAVORABLE.texte=Une décision favorable a été prise sur votre demande {numero} ({document}). Le document est en cours de signature.\n\nAucune action n'est attendue de votre part. Un message vous sera envoyé dès qu'il sera disponible.
DECISION_FAVORABLE.sms=e-mine : decision favorable pour {numero}. Document en cours de signature.

DEMANDE_REJETEE.sujet=Demande rejetée · {numero}
DEMANDE_REJETEE.texte=Votre demande {numero} ({document}) a été rejetée.\n\nMotif : {motif}\n\nLe détail de la décision est disponible dans le suivi de votre demande.
DEMANDE_REJETEE.sms=e-mine : demande {numero} rejetee. Motif et detail dans votre espace.

DOCUMENT_DELIVRE.sujet=Document délivré · {numero}
DOCUMENT_DELIVRE.texte=Votre document ({document}) est signé et délivré pour la demande {numero}.\n\nVous pouvez le télécharger depuis le suivi de votre demande. Son authenticité se vérifie à tout moment grâce à son code QR.
DOCUMENT_DELIVRE.sms=e-mine : document de la demande {numero} delivre. Telechargez-le dans votre espace.

DOCUMENT_REVOQUE.sujet=Document révoqué · {numero}
DOCUMENT_REVOQUE.texte=Le document {document_numero} ({document}) délivré pour votre demande {numero} a été révoqué.\n\nRévoqué par : {autorite}\nMotif : {motif}\n\nCe document n'est plus valide : sa vérification par code QR indique désormais « NON VALIDE ». Pour toute question, contactez le service indiqué dans le suivi de votre demande.
DOCUMENT_REVOQUE.sms=e-mine : document {document_numero} revoque. Motif dans votre espace.

PAIEMENT_A_VERIFIER.sujet=Paiement en cours de vérification · {reference}
PAIEMENT_A_VERIFIER.texte=Votre paiement (référence {reference}, montant attendu {montant_gnf}) est en cours de vérification par le service financier : le montant reçu ne correspond pas exactement au montant attendu.\n\nAucune action n'est attendue de votre part pour le moment. Un message vous sera envoyé avec le résultat.
PAIEMENT_A_VERIFIER.sms=e-mine : paiement {reference} en cours de verification. Aucune action de votre part.

PAIEMENT_COMPLEMENT.sujet=Complément de paiement attendu · {reference}
PAIEMENT_COMPLEMENT.texte=Le service financier a bien reçu une partie de votre paiement (référence {reference}, montant dû {montant_gnf}). Votre paiement n’est pas rejeté : il reste {reste_gnf} à payer, de préférence avant le {echeance}.\n\nMotif : {motif}\n\nOuvrez votre demande dans votre espace pour payer le reste. Un reçu vous sera remis pour ce complément.
PAIEMENT_COMPLEMENT.sms=e-mine : paiement {reference} incomplet. Reste a payer : {reste_gnf}, avant le {echeance}. Voir votre espace.

PAIEMENT_REJETE.sujet=Paiement rejeté · {reference}
PAIEMENT_REJETE.texte=Votre paiement (référence {reference}, montant attendu {montant_gnf}) n’a pas pu être accepté par le service financier.\n\nMotif : {motif}\n\nUn nouveau paiement est attendu : ouvrez votre demande dans votre espace pour payer à nouveau. Si une somme a été reçue, elle vous sera remboursée.
PAIEMENT_REJETE.sms=e-mine : paiement {reference} rejete. Nouveau paiement attendu, voir votre espace.

REFERENCE_EXPIRE_BIENTOT.sujet=Référence de paiement bientôt expirée · {reference}
REFERENCE_EXPIRE_BIENTOT.texte=La référence de paiement {reference} ({montant_gnf}) expire le {dateExpiration}.\n\nMerci d'effectuer le paiement avant cette date. Après expiration, une nouvelle référence vous sera proposée.
REFERENCE_EXPIRE_BIENTOT.sms=e-mine : reference {reference} ({montant_gnf}) expire le {dateExpiration}. Payez avant cette date.

REMBOURSEMENT.sujet=Remboursement effectué · {reference}
REMBOURSEMENT.texte=Le remboursement de {montant_gnf} lié au paiement {reference} a été effectué.\n\nLe détail est disponible dans votre espace.
REMBOURSEMENT.sms=e-mine : remboursement de {montant_gnf} effectue (paiement {reference}).
