# Modèles des notifications (US-07.1, US-07.2) : français, langue par défaut.
# {numero} = numéro de la demande ; les autres variables viennent du contenu écrit par la base.
# SMS : 160 caractères au plus (vérifié par les tests), sans accent superflu.
commun.salutation=Bonjour {prenom},
commun.lien=Suivre ma demande
commun.pied=Message automatique de la plateforme e-mine du Ministère des Mines et de la Géologie. Merci de ne pas y répondre.
commun.entete=Ministère des Mines et de la Géologie

PAIEMENT_CONFIRME.sujet=Paiement confirmé · {reference}
PAIEMENT_CONFIRME.texte=Votre paiement de {montant_gnf} (référence {reference}) est confirmé. Le reçu {recu} est disponible dans votre espace.
PAIEMENT_CONFIRME.sms=e-mine : paiement {reference} de {montant_gnf} confirme. Recu {recu} dans votre espace.

COMPLEMENT_DEMANDE.sujet=Complément demandé · {numero}
COMPLEMENT_DEMANDE.texte=Le Ministère demande un complément pour votre demande {numero}. Pièces attendues : {pieces}.\n\nMerci de répondre avant le {dateLimite} depuis le suivi de votre demande. Le délai de traitement est suspendu jusqu'à votre réponse.
COMPLEMENT_DEMANDE.sms=e-mine : complement demande pour {numero}. Reponse attendue avant le {dateLimite} dans votre espace.

COMPLEMENT_RELANCE.sujet=Rappel : complément attendu · {numero}
COMPLEMENT_RELANCE.texte=Nous n'avons pas encore reçu le complément demandé pour votre demande {numero}. Merci de répondre avant le {dateLimite} depuis le suivi de votre demande.
COMPLEMENT_RELANCE.sms=e-mine : rappel, complement attendu pour {numero} avant le {dateLimite}.
