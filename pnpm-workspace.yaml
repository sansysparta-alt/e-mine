packages:
  - apps/*
  - packages/*
  - api
  - simulateurs/*
  - tests/*
allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  esbuild: true
# Sécurité (alerte Dependabot n° 1, GHSA minimatch : déni de service par amplification) :
# les versions 7.x à 11.0.0 tirées par ESLint et typescript-eslint passent à la version corrigée.
overrides:
  "minimatch@>=7.0.0 <11.0.1": "11.0.9"
